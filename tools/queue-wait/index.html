<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Queue Wait Estimator — Snackbox</title>
  <script>
    (function(){var t=localStorage.getItem('snackbox-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
  <link rel="stylesheet" href="../../shared/style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="nav">
    <a href="../../" class="nav__brand">Snackbox</a>
    <span class="nav__spacer"></span>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9790;</button>
  </nav>

  <div class="app-container qw">
    <h1>Queue Wait Estimator</h1>

    <button type="button" class="board" id="board">
      <span class="board__label"><i></i>NOW SERVING</span>
      <span class="flaps" id="flaps" aria-hidden="true"></span>
      <span class="board__hint">tap the board if numbers jumped</span>
    </button>

    <div class="ticket" id="ticket">
      <div class="ticket__top">
        <button type="button" class="ticket__mine" id="your-num-btn" aria-label="Your number. Tap to change.">
          <span class="lbl">Your number</span>
          <span class="ticket__num"><small>#</small><span id="your-num">&mdash;</span></span>
        </button>
        <div class="ticket__eta">
          <span class="shift" id="shift"></span>
          <span class="lbl" id="countdown-label">Called in</span>
          <span class="cd" id="countdown">--:--</span>
          <span class="cd-sub" id="call-time" aria-live="polite">&nbsp;</span>
        </div>
      </div>
      <div class="perf"></div>
      <div class="stubs" id="stubs" aria-hidden="true"></div>
      <div class="stubs-cap" id="stubs-caption" aria-live="polite">&nbsp;</div>
      <div class="stamp" id="stamp" aria-hidden="true"></div>
    </div>

    <div class="controls">
      <button type="button" class="side" id="undo-btn"><b>&#8630;</b>undo</button>
      <button type="button" class="next" id="next-btn">NEXT<small>CALLED</small></button>
      <button type="button" class="side" id="jump-btn"><b>#</b>jump</button>
    </div>
    <p class="caption">Tap <b>NEXT</b> every time the counter calls a number</p>

    <div class="receipt">
      <div class="receipt__head">*** QUEUE LOG ***</div>
      <div class="receipt__hint">tap a line to void it</div>
      <ol id="log"></ol>
      <div class="receipt__foot" id="log-foot"></div>
    </div>
    <button type="button" class="new-ticket" id="new-ticket">New ticket</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <form class="sheet__card" id="sheet-form" novalidate>
      <div class="sheet__head">
        <label class="sheet__title" id="sheet-title" for="sheet-input"></label>
        <button type="button" class="sheet__cancel" id="sheet-cancel">Cancel</button>
      </div>
      <div class="sheet__row">
        <input id="sheet-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off">
        <button type="submit" class="sheet__ok">OK</button>
      </div>
      <p class="sheet__error" id="sheet-error" aria-live="polite"></p>
    </form>
  </div>

  <script src="../../shared/theme.js"></script>
  <script src="script.js"></script>
</body>
</html>
