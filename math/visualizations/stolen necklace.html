<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>stolen necklace</title>
  </head>
  <body>
  
  <script type="text/javascript">
	function createArray(totalLen, nTypes) {
	  const countPerType = getCountPerType(totalLen, nTypes);
	  const typeSymbols = Array.from({length: nTypes}, (v, i) => String.fromCharCode(97+i));
	  let output = [];
	  while (countPerType.some(x=> x > 0)) {
		let remainingIndices = countPerType.map((x,i) => x>0 ? i:-1).filter(x=>x>-1);
		let randIndex = remainingIndices[Math.floor(Math.random()*remainingIndices.length)];
		output.push(typeSymbols[randIndex]);
		countPerType[randIndex] -= 1;
	  }
	  return output;
	}

	//array with nTypes dims,
	//increment random index by 1 until get to totallen
	function getCountPerType(totalLen, nTypes) {
	  let output = Array.from({length: nTypes}, x =>1);
	  for (let i = nTypes; i<totalLen/2; i++) {
		let randIndex = Math.floor(Math.random()*nTypes)
		output[randIndex] += 1;
	  }
	  return output.map(x=> x*2);
	}

	function checkCreated(arr) {
		let output = {};
		arr.forEach(x => output.hasOwnProperty(x) ? output[x] +=1 : output[x]=1);
		return output;
	}
	
	checkCreated(createArray(18,4))
	
	
  </script>
  </body>
</html>
