  <script type="text/javascript">
	let slider = document.querySelector("[name=squircle_parameter]");
	slider.addEventListener('input', changedSlider);
	let slider_label = document.getElementById('slider_label');
	let squircle_svg = document.getElementById('squircle_svg');
	let path = document.createElementNS("http://www.w3.org/2000/svg", 'path');
	
	path.style.stroke = "#000"; //Set stroke colour
	path.style.strokeWidth = "2px";
	path.style.fill= "transparent";
	squircle_svg.appendChild(path);
	const PI = 3.14159265;
	const RADIUS = 200;
	
	function changedSlider(e) {
		let power = Math.floor(100*(2+8*(+e.target.value)/1000))/100;
		let powerString = power.toFixed(2);

		slider_label.innerHTML = "x<sup>"+powerString+"</sup> + y<sup>"+powerString+"</sup> = r<sup>"+powerString+"</sup>";
		let p = "";
		power = 2/power;
		for (let i = 0; i< 360; i+=2) {
			let x = 210 + Math.sign(Math.cos(PI * i/180))*RADIUS*Math.abs(Math.cos(PI * i/180))**power;
			let y = 250 + Math.sign(Math.sin(PI * i/180))*RADIUS*Math.abs(Math.sin(PI * i/180))**power;
			if (i===0) {
				p += "M " + x + " " + y + " ";
			} else {
				p += "L " + x + " " + y + " ";
			}
		}
		p += "z";
		path.setAttribute("d",p);
		
	}

	changedSlider({target: {value:250}});
