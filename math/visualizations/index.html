<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Visualizations</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300&family=Source+Serif+4:wght@300;600&display=swap');
    </style>
    <style>
      * {
        box-sizing: border-box;
        font-family: 'Source Serif 4', serif;
      }
      body {
        margin: 0;
        background-color: rgb(253, 250, 253);
        color: #212324;
      }
      #page {
        display: flex;
        min-height: 100vh;
      }

      /* ---------- sidebar ---------- */
      #sidebar {
        width: 280px;
        flex-shrink: 0;
        background-color: rgb(255, 255, 255);
        border-right: 1px solid #e9e4ec;
        padding-bottom: 30px;
      }
      #home-link {
        display: block;
        padding: 18px 20px 4px;
        font-size: 0.85em;
        color: #8a8a90;
        text-decoration: none;
      }
      #home-link:hover {
        color: #212324;
      }
      #sidebar h1 {
        margin: 0 0 8px;
        padding: 4px 20px 12px;
        font-size: 1.25em;
        font-weight: 600;
        background-image: linear-gradient(
          -2deg,
          rgba(255, 255, 255) 40%,
          rgb(228 236 245)
        );
      }
      .viz-item {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        border-left: 3px solid transparent;
        padding: 12px 20px;
        cursor: pointer;
        transition: background-color 0.3s ease-in;
      }
      .viz-item:hover {
        background-color: rgb(223 239 242);
      }
      .viz-item.active {
        background-color: rgb(223 239 242);
        border-left-color: rgb(122, 163, 191);
      }
      .viz-item-title {
        font-weight: 600;
        font-size: 1.02em;
      }
      .viz-item-sub {
        font-size: 0.82em;
        color: #79797f;
      }

      /* ---------- panel ---------- */
      #panel {
        flex: 1;
        padding: 26px 38px 50px;
        min-width: 0;
      }
      #panel h2 {
        margin: 0 0 6px;
        font-weight: 600;
      }
      #viz-link {
        color: #212324;
        text-decoration: none;
        border-bottom: 1px dashed #a9bfd2;
      }
      #viz-link:hover {
        background-color: rgb(223 239 242);
      }
      #viz-description {
        margin: 0 0 18px;
        max-width: 640px;
        font-size: 0.95em;
        color: #55555b;
      }
      #viz-description a {
        color: inherit;
      }

      /* ---------- shared controls ---------- */
      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        max-width: 640px;
      }
      .controls label {
        font-size: 0.92em;
      }
      button {
        font: inherit;
        font-size: 0.92em;
        padding: 6px 16px;
        background-color: rgb(255, 255, 255);
        border: 1px solid #c9c9cf;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease-in;
      }
      button:hover {
        background-color: rgb(223 239 242);
      }
      input[type='number'] {
        font: inherit;
        font-size: 0.92em;
        width: 74px;
        padding: 5px 8px;
        border: 1px solid #c9c9cf;
        border-radius: 8px;
        background-color: #fff;
      }
      input[type='range'] {
        width: 100%;
        margin: 0;
        accent-color: rgb(122, 163, 191);
      }
      .slider-row {
        max-width: 640px;
        margin-bottom: 10px;
      }
      .slider-row label {
        display: block;
        font-size: 0.92em;
        margin-bottom: 4px;
      }
      .minmax-row {
        display: flex;
        justify-content: space-between;
        margin-top: 6px;
      }
      .minmax-row input {
        width: 74px;
        text-align: center;
      }
      .minmax-row input.current {
        font-weight: 600;
      }
      .equation {
        font-size: 1.05em;
        margin: 0 0 14px;
      }

      /* ---------- stage ---------- */
      .stage-box {
        background-color: rgb(255, 255, 255);
        border: 1px solid #eee7f0;
        border-radius: 15px;
        padding: 12px;
        max-width: 640px;
      }
      .stage-box canvas,
      .stage-box svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 12px;
        font-size: 0.9em;
      }
      .legend .dot {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: -1px;
        border: 1px solid rgba(0, 0, 0, 0.25);
      }

      /* ---------- small screens ---------- */
      @media screen and (max-width: 820px) {
        #page {
          flex-direction: column;
        }
        #sidebar {
          width: 100%;
          border-right: none;
          border-bottom: 1px solid #e9e4ec;
          padding-bottom: 10px;
        }
        #viz-list {
          display: flex;
          flex-wrap: wrap;
          gap: 6px;
          padding: 0 14px;
        }
        .viz-item {
          width: auto;
          border: 1px solid #e0dde4;
          border-radius: 20px;
          padding: 6px 14px;
        }
        .viz-item.active {
          border-color: rgb(122, 163, 191);
        }
        .viz-item-sub {
          display: none;
        }
        #panel {
          padding: 22px 16px 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="page">
      <aside id="sidebar">
        <a id="home-link" href="../../">&larr; vladgotlib.com</a>
        <h1>Math Visualizations</h1>
        <nav id="viz-list"></nav>
      </aside>
      <main id="panel">
        <h2><a id="viz-link" target="_blank" href=""></a></h2>
        <p id="viz-description"></p>
        <section id="viz-stage"></section>
      </main>
    </div>

    <script>
      /* Okabe-Ito colorblind-safe palette, used wherever a viz needs color */
      const PALETTE = [
        '#0072B2',
        '#E69F00',
        '#009E73',
        '#CC79A7',
        '#56B4E9',
        '#D55E00',
        '#F0E442',
      ]

      /* ================= squircle ================= */
      function initSquircle(stage) {
        stage.innerHTML = `
          <p class="equation" id="sq-label">x<sup>4</sup> + y<sup>4</sup> = r<sup>4</sup></p>
          <div class="slider-row">
            <input id="sq-range" type="range" min="0" max="1000" value="250" />
          </div>
          <div class="stage-box">
            <svg id="sq-svg" viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>`

        const svg = stage.querySelector('#sq-svg')
        const label = stage.querySelector('#sq-label')
        const slider = stage.querySelector('#sq-range')
        const CX = 220
        const CY = 220
        const RADIUS = 200

        function superellipsePath(power) {
          const exp = 2 / power
          let p = ''
          for (let i = 0; i < 360; i += 2) {
            const a = (Math.PI * i) / 180
            const x =
              CX + Math.sign(Math.cos(a)) * RADIUS * Math.abs(Math.cos(a)) ** exp
            const y =
              CY + Math.sign(Math.sin(a)) * RADIUS * Math.abs(Math.sin(a)) ** exp
            p += (i === 0 ? 'M ' : 'L ') + x + ' ' + y + ' '
          }
          return p + 'z'
        }

        function makePath(style) {
          const el = document.createElementNS(
            'http://www.w3.org/2000/svg',
            'path'
          )
          Object.assign(el.style, style)
          svg.appendChild(el)
          return el
        }

        const guideCircle = makePath({
          stroke: '#d4d4d8',
          strokeWidth: '1px',
          fill: 'transparent',
        })
        guideCircle.setAttribute('d', superellipsePath(2))
        const guideSquare = makePath({
          stroke: '#d4d4d8',
          strokeWidth: '1px',
          fill: 'transparent',
        })
        guideSquare.setAttribute(
          'd',
          `M ${CX + RADIUS} ${CY - RADIUS} V ${CY + RADIUS} H ${
            CX - RADIUS
          } V ${CY - RADIUS} z`
        )
        const path = makePath({
          stroke: '#212324',
          strokeWidth: '2px',
          fill: 'transparent',
        })

        function changedSlider() {
          const power = Math.floor(100 * (2 + (8 * +slider.value) / 1000)) / 100
          const ps = power.toFixed(2)
          label.innerHTML = `x<sup>${ps}</sup> + y<sup>${ps}</sup> = r<sup>${ps}</sup>`
          path.setAttribute('d', superellipsePath(power))
        }

        slider.addEventListener('input', changedSlider)
        changedSlider()
      }

      /* ================= modulo multiplication ================= */
      function initModulo(stage) {
        stage.innerHTML = `
          <div class="slider-row">
            <label for="m-range">Set multiplier</label>
            <input id="m-range" type="range" min="0" max="1000" value="250" />
            <div class="minmax-row">
              <input id="m-min" type="number" placeholder="min" value="2" />
              <input id="m-cur" class="current" type="number" />
              <input id="m-max" type="number" placeholder="max" value="10" />
            </div>
          </div>
          <div class="controls">
            <button id="m-play" type="button">play</button>
            <label><input type="checkbox" id="m-forever" /> forever</label>
          </div>
          <div class="stage-box">
            <svg id="m-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>`

        const svg = stage.querySelector('#m-svg')
        const slider = stage.querySelector('#m-range')
        const currentInput = stage.querySelector('#m-cur')
        const playBtn = stage.querySelector('#m-play')
        const foreverCb = stage.querySelector('#m-forever')

        const path = document.createElementNS(
          'http://www.w3.org/2000/svg',
          'path'
        )
        path.style.stroke = '#212324'
        path.style.strokeWidth = '0.2px'
        path.style.fill = 'transparent'
        svg.appendChild(path)

        const RADIUS = 298
        const NUM_POINTS = 200
        const SIZE = 600
        let currentRangeValue = 250
        let rangeMin = 2
        let rangeMax = 10
        let running = false
        let rafId = 0

        function sliderToPower(v) {
          return Math.floor(100 * (rangeMin + ((rangeMax - rangeMin) * +v) / 1000)) / 100
        }
        function powerToSlider(p) {
          return (1000 / (rangeMax - rangeMin)) * (+p - rangeMin)
        }

        function render(sliderValue) {
          currentRangeValue = +sliderValue
          const power = sliderToPower(currentRangeValue)
          currentInput.value = power.toFixed(2)
          let p = ''
          for (let i = 1; i < NUM_POINTS; i += 1) {
            const x0 = -RADIUS * Math.cos((i / NUM_POINTS) * 2 * Math.PI)
            const y0 = RADIUS * Math.sin((i / NUM_POINTS) * 2 * Math.PI)
            const x1 = -RADIUS * Math.cos(((power * i) / NUM_POINTS) * 2 * Math.PI)
            const y1 = RADIUS * Math.sin(((power * i) / NUM_POINTS) * 2 * Math.PI)
            p += 'M ' + (SIZE / 2 + x0) + ' ' + (SIZE / 2 + y0) + ' '
            p += 'L ' + (SIZE / 2 + x1) + ' ' + (SIZE / 2 + y1) + ' '
          }
          path.setAttribute('d', p + 'z')
        }

        slider.addEventListener('input', (e) => render(e.target.value))
        currentInput.addEventListener('change', (e) => {
          const v = powerToSlider(e.target.value)
          slider.value = v
          render(v)
        })
        stage.querySelector('#m-min').addEventListener('change', (e) => {
          rangeMin = +e.target.value
          render(currentRangeValue)
        })
        stage.querySelector('#m-max').addEventListener('change', (e) => {
          rangeMax = +e.target.value
          render(currentRangeValue)
        })

        function step() {
          slider.value = currentRangeValue
          render(currentRangeValue)
          currentRangeValue += 1
          if (!foreverCb.checked && currentRangeValue > 1000) {
            running = false
            playBtn.textContent = 'play'
            return
          }
          if (running) rafId = window.requestAnimationFrame(step)
        }

        playBtn.addEventListener('click', () => {
          running = !running
          playBtn.textContent = running ? 'stop' : 'play'
          if (running) step()
        })

        render(250)
        return () => {
          running = false
          cancelAnimationFrame(rafId)
        }
      }

      /* ================= sierpinski / chaos triangles ================= */
      function initChaos(stage) {
        stage.innerHTML = `
          <div class="controls">
            <button id="ch-random" type="button">fill randomly</button>
            <button id="ch-iterative" type="button">fill iteratively</button>
          </div>
          <div class="stage-box">
            <canvas id="ch-canvas" width="700" height="700"></canvas>
          </div>`

        const c = stage.querySelector('#ch-canvas')
        const ctx = c.getContext('2d')
        const endpoints = [
          { x: 0.5, y: 0.02 },
          { x: 0.02, y: 0.98 },
          { x: 0.98, y: 0.98 },
        ]
        const currentPoint = { x: 300, y: 300 }
        let running = false
        let timer = 0
        let rafId = 0

        function init() {
          clearTimeout(timer)
          cancelAnimationFrame(rafId)
          running = false
          ctx.clearRect(0, 0, c.width, c.height)
          currentPoint.x = 300
          currentPoint.y = 300
        }

        function runRandom() {
          for (let i = 0; i < 100; i++) {
            const attractor = endpoints[Math.floor(Math.random() * 3)]
            currentPoint.x += (c.width * attractor.x - currentPoint.x) / 2
            currentPoint.y += (c.height * attractor.y - currentPoint.y) / 2
            ctx.fillStyle = '#212324'
            ctx.fillRect(currentPoint.x, currentPoint.y, 1, 1)
          }
          if (running) rafId = window.requestAnimationFrame(runRandom)
        }

        function fillIteratively() {
          ctx.fillStyle = '#212324'
          ctx.beginPath()
          ctx.moveTo(c.width * endpoints[0].x, c.height * endpoints[0].y)
          ctx.lineTo(c.width * endpoints[1].x, c.height * endpoints[1].y)
          ctx.lineTo(c.width * endpoints[2].x, c.height * endpoints[2].y)
          ctx.closePath()
          ctx.fill()

          const queue = [{ depth: 0, triangle: endpoints }]
          function step() {
            if (!queue.length || queue[0].depth >= 8) return
            const { depth, triangle } = queue.shift()
            const mid = [
              {
                x: (triangle[0].x + triangle[1].x) / 2,
                y: (triangle[0].y + triangle[1].y) / 2,
              },
              {
                x: (triangle[1].x + triangle[2].x) / 2,
                y: (triangle[1].y + triangle[2].y) / 2,
              },
              {
                x: (triangle[2].x + triangle[0].x) / 2,
                y: (triangle[2].y + triangle[0].y) / 2,
              },
            ]
            ctx.fillStyle = '#fff'
            ctx.beginPath()
            ctx.moveTo(c.width * mid[0].x, c.height * mid[0].y)
            ctx.lineTo(c.width * mid[1].x, c.height * mid[1].y)
            ctx.lineTo(c.width * mid[2].x, c.height * mid[2].y)
            ctx.closePath()
            ctx.fill()

            queue.push({ depth: depth + 1, triangle: [triangle[0], mid[0], mid[2]] })
            queue.push({ depth: depth + 1, triangle: [mid[0], triangle[1], mid[1]] })
            queue.push({ depth: depth + 1, triangle: [mid[2], triangle[2], mid[1]] })
            timer = setTimeout(step, 20)
          }
          step()
        }

        stage.querySelector('#ch-random').addEventListener('click', () => {
          init()
          running = true
          runRandom()
        })
        stage.querySelector('#ch-iterative').addEventListener('click', () => {
          init()
          fillIteratively()
        })

        return () => {
          running = false
          clearTimeout(timer)
          cancelAnimationFrame(rafId)
        }
      }

      /* ================= random walk ================= */
      function initRandomWalk(stage) {
        stage.innerHTML = `
          <div class="controls">
            <button id="rw-restart" type="button">restart</button>
          </div>
          <div class="stage-box">
            <canvas id="rw-canvas" width="800" height="600"></canvas>
          </div>`

        const c = stage.querySelector('#rw-canvas')
        const ctx = c.getContext('2d')
        const NUM_POINTS = 1000
        const ITERATIONS = 400
        let rafId = 0

        function start() {
          cancelAnimationFrame(rafId)
          ctx.clearRect(0, 0, c.width, c.height)
          const points = []
          for (let i = 0; i < NUM_POINTS; i++) {
            points[i] = [Math.random() * c.width, Math.random() * c.height]
          }
          let iteration = 0

          function draw() {
            iteration += 1
            for (let i = 0; i < NUM_POINTS; i++) {
              points[i][0] += 3 * (Math.random() - 0.5)
              points[i][1] += 3 * (Math.random() - 0.5)
              ctx.beginPath()
              ctx.moveTo(points[i][0], points[i][1])
              points[i][0] += 3 * (Math.random() - 0.5)
              points[i][1] += 3 * (Math.random() - 0.5)
              ctx.lineTo(points[i][0], points[i][1])
              ctx.stroke()
            }
            if (iteration < ITERATIONS) rafId = window.requestAnimationFrame(draw)
          }
          rafId = window.requestAnimationFrame(draw)
        }

        stage.querySelector('#rw-restart').addEventListener('click', start)
        start()
        return () => cancelAnimationFrame(rafId)
      }

      /* ================= galton board ================= */
      function initGalton(stage) {
        stage.innerHTML = `
          <div class="controls">
            <button id="g-run" type="button">drop balls</button>
            <button id="g-reset" type="button">reset</button>
            <label for="g-rows">rows</label>
            <input id="g-rows" type="number" value="10" min="3" max="14" />
            <span id="g-total" style="margin-left:auto;color:#79797f;font-size:.92em"></span>
          </div>
          <div class="stage-box">
            <canvas id="g-canvas" width="700" height="700"></canvas>
          </div>`

        const c = stage.querySelector('#g-canvas')
        const ctx = c.getContext('2d')
        const runBtn = stage.querySelector('#g-run')
        const rowsInput = stage.querySelector('#g-rows')
        const totalLabel = stage.querySelector('#g-total')

        const CX = 350
        const TOP = 70
        const BINS_TOP = 480
        const BINS_BOTTOM = 660
        let rows = 10
        let sx, vy, ballR, binomial
        let counts = []
        let balls = []
        let total = 0
        let running = false
        let frame = 0
        let rafId = 0

        function layout() {
          sx = Math.min(52, 600 / rows)
          vy = (BINS_TOP - 50 - TOP) / (rows - 1)
          ballR = Math.max(4, Math.min(9, sx * 0.24))
          binomial = [1]
          for (let k = 0; k < rows; k++) {
            binomial.push((binomial[k] * (rows - k)) / (k + 1))
          }
        }

        function pegPos(r, k) {
          return { x: CX + (k - r / 2) * sx, y: TOP + r * vy }
        }
        function binX(i) {
          return CX + (i - rows / 2) * sx
        }
        function barScale() {
          const usable = BINS_BOTTOM - BINS_TOP - 10
          return usable / Math.max(10, ...counts)
        }
        function barTop(i) {
          return BINS_BOTTOM - counts[i] * barScale()
        }

        function reset() {
          counts = Array(rows + 1).fill(0)
          balls = []
          total = 0
        }

        function spawn() {
          const pts = [{ x: CX, y: TOP - 45 }]
          let k = 0
          for (let r = 0; r < rows; r++) {
            pts.push(pegPos(r, k))
            if (Math.random() < 0.5) k++
          }
          balls.push({ pts, bin: k, seg: 0, t: 0 })
        }

        function update() {
          for (let i = balls.length - 1; i >= 0; i--) {
            const b = balls[i]
            b.t += 0.16
            if (b.t >= 1) {
              b.t = 0
              b.seg++
              if (b.seg >= b.pts.length) {
                counts[b.bin]++
                total++
                balls.splice(i, 1)
              }
            }
          }
        }

        function ballPos(b) {
          const from = b.pts[b.seg]
          const to =
            b.seg + 1 < b.pts.length
              ? b.pts[b.seg + 1]
              : { x: binX(b.bin), y: barTop(b.bin) - ballR }
          const t = b.t * b.t * (3 - 2 * b.t)
          return { x: from.x + (to.x - from.x) * t, y: from.y + (to.y - from.y) * t }
        }

        function draw() {
          ctx.clearRect(0, 0, c.width, c.height)

          ctx.fillStyle = '#c9c9cf'
          for (let r = 0; r < rows; r++) {
            for (let k = 0; k <= r; k++) {
              const p = pegPos(r, k)
              ctx.beginPath()
              ctx.arc(p.x, p.y, 3, 0, 2 * Math.PI)
              ctx.fill()
            }
          }

          const scale = barScale()
          ctx.fillStyle = 'rgb(223, 239, 242)'
          ctx.strokeStyle = 'rgb(122, 163, 191)'
          ctx.lineWidth = 1
          for (let i = 0; i <= rows; i++) {
            const h = counts[i] * scale
            if (h > 0) {
              ctx.fillRect(binX(i) - sx / 2 + 2, BINS_BOTTOM - h, sx - 4, h)
              ctx.strokeRect(binX(i) - sx / 2 + 2, BINS_BOTTOM - h, sx - 4, h)
            }
          }

          ctx.strokeStyle = '#212324'
          ctx.lineWidth = 1
          ctx.beginPath()
          ctx.moveTo(binX(0) - sx / 2, BINS_BOTTOM)
          ctx.lineTo(binX(rows) + sx / 2, BINS_BOTTOM)
          ctx.stroke()

          if (total > 0) {
            ctx.strokeStyle = '#79797f'
            ctx.setLineDash([5, 4])
            ctx.beginPath()
            for (let i = 0; i <= rows; i++) {
              const expected = (total * binomial[i]) / 2 ** rows
              const y = BINS_BOTTOM - expected * scale
              if (i === 0) ctx.moveTo(binX(i), y)
              else ctx.lineTo(binX(i), y)
            }
            ctx.stroke()
            ctx.setLineDash([])
          }

          ctx.fillStyle = PALETTE[0]
          balls.forEach((b) => {
            const p = ballPos(b)
            ctx.beginPath()
            ctx.arc(p.x, p.y, ballR, 0, 2 * Math.PI)
            ctx.fill()
          })

          totalLabel.textContent = total + ' balls'
        }

        function tick() {
          frame++
          if (running && frame % 5 === 0 && balls.length < 80) spawn()
          update()
          draw()
          rafId = window.requestAnimationFrame(tick)
        }

        runBtn.addEventListener('click', () => {
          running = !running
          runBtn.textContent = running ? 'stop' : 'drop balls'
        })
        stage.querySelector('#g-reset').addEventListener('click', reset)
        rowsInput.addEventListener('change', () => {
          rows = Math.min(14, Math.max(3, Math.floor(+rowsInput.value) || 10))
          rowsInput.value = rows
          layout()
          reset()
        })

        layout()
        reset()
        tick()
        return () => cancelAnimationFrame(rafId)
      }

      /* ================= ternary diagram ================= */
      function initTernary(stage) {
        stage.innerHTML = `
          <div class="controls">
            <label>Enter 3 numbers:</label>
            <input class="t-input" id="t-x" type="number" placeholder="x" />
            <input class="t-input" id="t-y" type="number" placeholder="y" />
            <input class="t-input" id="t-z" type="number" placeholder="z" />
            <button id="t-draw" type="button">draw</button>
            <button id="t-clear" type="button">clear</button>
          </div>
          <div class="stage-box">
            <canvas id="t-canvas" width="700" height="700"></canvas>
          </div>`

        const c = stage.querySelector('#t-canvas')
        const ctx = c.getContext('2d')
        const endpoints = [
          { x: 0.5, y: 0.09 },
          { x: 0.05, y: 0.87 },
          { x: 0.95, y: 0.87 },
        ]

        function midpoint(o1, o2) {
          return { x: (o1.x + o2.x) / 2, y: (o1.y + o2.y) / 2 }
        }

        function drawBoundary() {
          ctx.clearRect(0, 0, c.width, c.height)
          ctx.strokeStyle = '#212324'
          ctx.lineWidth = 6
          ctx.beginPath()
          ctx.moveTo(c.width * endpoints[0].x, c.height * endpoints[0].y)
          ctx.lineTo(c.width * endpoints[1].x, c.height * endpoints[1].y)
          ctx.lineTo(c.width * endpoints[2].x, c.height * endpoints[2].y)
          ctx.closePath()
          ctx.stroke()

          ctx.lineWidth = 0.3
          ;[
            [endpoints[0], midpoint(endpoints[1], endpoints[2])],
            [endpoints[1], midpoint(endpoints[0], endpoints[2])],
            [endpoints[2], midpoint(endpoints[0], endpoints[1])],
          ].forEach(([from, to]) => {
            ctx.beginPath()
            ctx.moveTo(c.width * from.x, c.height * from.y)
            ctx.lineTo(c.width * to.x, c.height * to.y)
            ctx.stroke()
          })

          ctx.fillStyle = '#79797f'
          ctx.font = '26px "Source Serif 4", serif'
          ctx.textAlign = 'center'
          ctx.fillText('x', c.width * endpoints[0].x, c.height * endpoints[0].y - 18)
          ctx.fillText('z', c.width * endpoints[1].x, c.height * endpoints[1].y + 36)
          ctx.fillText('y', c.width * endpoints[2].x, c.height * endpoints[2].y + 36)
        }

        function draw() {
          const inputs = {}
          ;['x', 'y', 'z'].forEach((k) => {
            const el = stage.querySelector('#t-' + k)
            inputs[k] = el.value ? +el.value : 0
          })
          const values = Object.values(inputs)
          const sum = values.reduce((a, b) => a + b, 0)
          if (sum <= 0 || Math.min(...values) < 0) return
          Object.keys(inputs).forEach((k) => (inputs[k] = inputs[k] / sum))

          const h = endpoints[1].y - endpoints[0].y
          const w = endpoints[2].x - endpoints[1].x
          const y = (h * (1 - inputs.x) + endpoints[0].y) * c.height
          const x =
            (w *
              (((inputs.x * Math.sqrt(3)) / 2 + Math.sqrt(3) * inputs.y) /
                Math.sqrt(3)) +
              endpoints[1].x) *
            c.width

          ctx.fillStyle = PALETTE[0]
          ctx.beginPath()
          ctx.arc(x, y, 5, 0, 2 * Math.PI)
          ctx.fill()
        }

        stage.querySelector('#t-draw').addEventListener('click', draw)
        stage.querySelector('#t-clear').addEventListener('click', drawBoundary)
        drawBoundary()
      }

      /* ================= stolen necklace ================= */
      function initNecklace(stage) {
        stage.innerHTML = `
          <div class="controls">
            <label for="n-beads">beads</label>
            <input id="n-beads" type="number" value="24" min="4" step="2" />
            <label for="n-types">types</label>
            <input id="n-types" type="number" value="4" min="2" max="7" />
            <button id="n-steal" type="button">steal a new necklace</button>
          </div>
          <div class="stage-box">
            <svg id="n-svg" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"></svg>
            <div class="legend" id="n-legend"></div>
          </div>`

        const svg = stage.querySelector('#n-svg')
        const legend = stage.querySelector('#n-legend')
        const beadsInput = stage.querySelector('#n-beads')
        const typesInput = stage.querySelector('#n-types')
        const SVGNS = 'http://www.w3.org/2000/svg'

        /* each type gets an even count, counts sum to totalLen */
        function getCountPerType(totalLen, nTypes) {
          const output = Array.from({ length: nTypes }, () => 1)
          for (let i = nTypes; i < totalLen / 2; i++) {
            output[Math.floor(Math.random() * nTypes)] += 1
          }
          return output.map((x) => x * 2)
        }

        function createNecklace(totalLen, nTypes) {
          const countPerType = getCountPerType(totalLen, nTypes)
          const output = []
          while (countPerType.some((x) => x > 0)) {
            const remaining = countPerType
              .map((x, i) => (x > 0 ? i : -1))
              .filter((x) => x > -1)
            const idx = remaining[Math.floor(Math.random() * remaining.length)]
            output.push(idx)
            countPerType[idx] -= 1
          }
          return output
        }

        function steal() {
          const nTypes = Math.min(7, Math.max(2, Math.floor(+typesInput.value) || 2))
          let nBeads = Math.floor(+beadsInput.value) || 24
          nBeads -= nBeads % 2
          nBeads = Math.min(200, Math.max(2 * nTypes, nBeads))
          typesInput.value = nTypes
          beadsInput.value = nBeads

          const beads = createNecklace(nBeads, nTypes)
          svg.innerHTML = ''

          const string = document.createElementNS(SVGNS, 'circle')
          string.setAttribute('cx', 300)
          string.setAttribute('cy', 300)
          string.setAttribute('r', 235)
          string.setAttribute('fill', 'none')
          string.setAttribute('stroke', '#d4d4d8')
          svg.appendChild(string)

          const beadR = Math.min(20, ((2 * Math.PI * 235) / beads.length) * 0.38)
          beads.forEach((type, i) => {
            const a = (i / beads.length) * 2 * Math.PI - Math.PI / 2
            const bead = document.createElementNS(SVGNS, 'circle')
            bead.setAttribute('cx', 300 + 235 * Math.cos(a))
            bead.setAttribute('cy', 300 + 235 * Math.sin(a))
            bead.setAttribute('r', beadR)
            bead.setAttribute('fill', PALETTE[type])
            bead.setAttribute('stroke', 'rgba(0,0,0,.3)')
            bead.setAttribute('stroke-width', '0.8')
            svg.appendChild(bead)
          })

          const counts = {}
          beads.forEach((t) => (counts[t] = (counts[t] || 0) + 1))
          legend.innerHTML = Object.keys(counts)
            .map(
              (t) =>
                `<span><span class="dot" style="background:${PALETTE[t]}"></span>&times;${counts[t]}</span>`
            )
            .join('')
        }

        stage.querySelector('#n-steal').addEventListener('click', steal)
        steal()
      }

      /* ================= list + routing ================= */
      const VIZUALIZATIONS = [
        {
          id: 'squircle',
          title: 'Squircle',
          sub: 'between a square and a circle',
          href: 'https://99percentinvisible.org/article/circling-square-designing-squircles-instead-rounded-rectangles/',
          description:
            'A squircle is a mathematical intermediate between a square and a circle. Drag the slider to morph one into the other.',
          init: initSquircle,
        },
        {
          id: 'modulo',
          title: 'Modulo Multiplication',
          sub: 'times tables & cardioids',
          href: 'https://www.youtube.com/watch?v=qhbuKbxJsk8',
          description:
            'Times tables drawn around a circle produce cardioids and other lovely patterns &mdash; the same ones hiding in the Mandelbrot set. Slide the multiplier, or press play and watch the patterns flow.',
          init: initModulo,
        },
        {
          id: 'chaos',
          title: 'Sierpinski Triangle',
          sub: 'order out of chaos',
          href: 'https://youtu.be/kbKtFN71Lfs',
          description:
            'Two very different ways to generate the same fractal: bouncing a point randomly halfway toward triangle corners, or recursively cutting out middle triangles.',
          init: initChaos,
        },
        {
          id: 'randomwalk',
          title: 'Random Walk',
          sub: 'a thousand wandering points',
          href: 'https://en.wikipedia.org/wiki/Random_walk',
          description:
            'A thousand points each take small random steps, weaving a tangled fabric out of nothing.',
          init: initRandomWalk,
        },
        {
          id: 'galton',
          title: 'Galton Board',
          sub: 'a bell curve from coin flips',
          href: 'https://en.wikipedia.org/wiki/Galton_board',
          description:
            'Each ball bounces left or right off every peg with equal probability, and yet the pile below always builds the same bell curve. The dashed outline is the mathematically expected binomial distribution.',
          init: initGalton,
        },
        {
          id: 'ternary',
          title: 'Ternary Diagram',
          sub: 'three numbers, one point',
          href: 'https://en.wikipedia.org/wiki/Ternary_plot',
          description:
            'A ternary diagram plots any mix of three quantities as a single point &mdash; each corner means &ldquo;100% of that one.&rdquo; Enter three numbers and press draw.',
          init: initTernary,
        },
        {
          id: 'necklace',
          title: 'Stolen Necklace',
          sub: 'fair division of loot',
          href: 'https://en.wikipedia.org/wiki/Necklace_splitting_problem',
          description:
            'Two thieves steal a necklace with an even number of beads of each type. The necklace splitting theorem says they can divide it fairly with surprisingly few cuts. Here is the loot: a random necklace with an even count of every bead type.',
          init: initNecklace,
        },
      ]

      const vizList = document.getElementById('viz-list')
      const vizLink = document.getElementById('viz-link')
      const vizDescription = document.getElementById('viz-description')
      const vizStage = document.getElementById('viz-stage')
      let cleanup = null

      VIZUALIZATIONS.forEach((viz) => {
        const btn = document.createElement('button')
        btn.className = 'viz-item'
        btn.dataset.id = viz.id
        btn.innerHTML = `<div class="viz-item-title">${viz.title}</div><div class="viz-item-sub">${viz.sub}</div>`
        btn.addEventListener('click', () => select(viz.id))
        vizList.appendChild(btn)
      })

      function select(id, updateHash = true) {
        const viz = VIZUALIZATIONS.find((v) => v.id === id) || VIZUALIZATIONS[0]
        if (cleanup) cleanup()
        cleanup = null
        vizStage.innerHTML = ''

        document.querySelectorAll('.viz-item').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.id === viz.id)
        })
        vizLink.textContent = viz.title
        vizLink.setAttribute('href', viz.href)
        vizDescription.innerHTML = viz.description
        document.title = viz.title + ' — Math Visualizations'
        if (updateHash) history.replaceState(null, '', '#' + viz.id)

        cleanup = viz.init(vizStage) || null
      }

      window.addEventListener('hashchange', () =>
        select(location.hash.slice(1), false)
      )
      select(location.hash.slice(1) || VIZUALIZATIONS[0].id)
    </script>
  </body>
