<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snackbox</title>
  <script>
    (function(){var t=localStorage.getItem('snackbox-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)})();
  </script>
  <link rel="stylesheet" href="shared/style.css">
</head>
<body>
  <nav class="nav">
    <span class="nav__brand">Snackbox</span>
    <span class="nav__spacer"></span>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9790;</button>
  </nav>

  <div class="container">
    <section class="section">
      <h2>Games</h2>
      <div class="card-grid">
        <div class="card">
          <a href="games/memory-game/" title="Match pairs of emoji cards before time runs out!">
            <span class="card__title">🧠 Memory Game</span>
          </a>
        </div>
        <div class="card">
          <a href="games/color-stroop/" title="Stroop test! Type the ink color, not the word. 60-second blitz.">
            <span class="card__title">🎨 Type the Color</span>
          </a>
        </div>
        <div class="card">
          <a href="games/bouncer/" title="Keep the puck alive and collect stars!">
            <span class="card__title">&#127934; Bouncer</span>
          </a>
        </div>
        <div class="card">
          <a href="games/tower-stacker/" title="Drop blocks to build the tallest tower!">
            <span class="card__title">&#127959; Tower Stacker</span>
          </a>
        </div>
        <div class="card">
          <a href="games/race-picker/" title="Pick the winning racer before the race ends!">
            <span class="card__title">&#127943; Pick the Winner</span>
          </a>
        </div>
        <div class="card">
          <a href="games/mystic-oracle/" title="A mystical oracle that reads minds... or does it?">
            <span class="card__title">&#128302; Mystic Oracle</span>
          </a>
        </div>
        <div class="card">
          <a href="games/flip-tiles/" title="Sweep over every tile to flip it — 10 levels, lowest time wins!">
            <span class="card__title">&#127924; Flip Tiles</span>
          </a>
        </div>
        <div class="card">
          <a href="games/flags/" title="Memorize four flags, then name the one that went missing!">
            <span class="card__title">🚩 Missing Flag</span>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Tools</h2>
      <div class="card-grid">
        <div class="card">
          <a href="tools/queue-wait/" title="Estimate how long until your number is called.">
            <span class="card__title">⏳ Queue Wait Estimator</span>
          </a>
        </div>
        <div class="card">
          <a href="tools/prompt-constraints/" title="See how each constraint shrinks the space of possible LLM outputs.">
            <span class="card__title">🎯 Prompt Constraints</span>
          </a>
        </div>
        <div class="card">
          <a href="tools/count-days/" title="Visualize the days until — or since — any date.">
            <span class="card__title">📆 Count Days</span>
          </a>
        </div>
        <div class="card">
          <a href="tools/buzz-curve/" title="Log your drinks and see your estimated blood alcohol rise and fall.">
            <span class="card__title">🍷 Buzz Curve</span>
          </a>
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Math</h2>
      <div class="card-grid">
        <div class="card">
          <a href="math/powerball-odds/" title="See why you'll never win the Powerball jackpot.">
            <span class="card__title">🎱 Powerball Odds</span>
          </a>
        </div>
        <div class="card">
          <a href="math/visualizations/" title="Interactive math visualizations: fractals, chaos, random walks, and more.">
            <span class="card__title">📐 Math Visualizations</span>
          </a>
        </div>
      </div>
    </section>
  </div>

  <script src="shared/theme.js"></script>
</body>
</html>
